<h2>官网视觉风格方案</h2>
<p class="subtitle">基于 logo 蓝色主色调，三种设计方向供选择</p>

<div class="cards">
  <div class="card" data-choice="modern" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: linear-gradient(135deg, #1a56db 0%, #0ea5e9 100%); height: 160px; display: flex; align-items: center; justify-content: center; border-radius: 8px 8px 0 0;">
        <div style="background: white; padding: 20px 40px; border-radius: 8px; text-align: center;">
          <div style="font-size: 24px; font-weight: bold; color: #1a56db;">宗靖</div>
          <div style="font-size: 12px; color: #666;">智能招商管理</div>
        </div>
      </div>
      <div style="padding: 20px; background: #f8fafc;">
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 70%; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 85%;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>科技现代风</h3>
      <p>深蓝渐变 + 几何线条，传达专业、智能、科技感。适合面向企业级客户的 SaaS 平台。</p>
    </div>
  </div>

  <div class="card" data-choice="professional" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: #f8fafc; height: 160px; display: flex; align-items: center; justify-content: center; border-radius: 8px 8px 0 0;">
        <div style="background: #1a56db; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          <div style="background: white; width: 40px; height: 40px; border-radius: 50%;"></div>
        </div>
      </div>
      <div style="padding: 20px; background: white; border-top: 3px solid #1a56db;">
        <div style="height: 8px; background: #1a56db; border-radius: 4px; width: 60%; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 80%; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 45%;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>稳重商务风</h3>
      <p>白底 + 蓝色块为主，留白充足，排版清晰。传达可信、专业、稳重的企业形象。</p>
    </div>
  </div>

  <div class="card" data-choice="dynamic" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background: linear-gradient(180deg, #1a56db 0%, #0ea5e9 50%, #06b6d4 100%); height: 160px; display: flex; align-items: center; justify-content: center; border-radius: 8px 8px 0 0; position: relative; overflow: hidden;">
        <div style="position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: -30px; left: 20px; width: 80px; height: 80px; background: rgba(255,255,255,0.08); border-radius: 50%;"></div>
        <div style="background: white; padding: 16px 32px; border-radius: 8px; text-align: center; position: relative; z-index: 1;">
          <div style="font-size: 22px; font-weight: bold; color: #1a56db;">宗靖</div>
          <div style="font-size: 11px; color: #1a56db;">ZONGJING</div>
        </div>
      </div>
      <div style="padding: 20px; background: #f0fdfa;">
        <div style="height: 8px; background: #0ea5e9; border-radius: 4px; width: 75%; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 55%; margin-bottom: 12px;"></div>
        <div style="height: 8px; background: #e2e8f0; border-radius: 4px; width: 70%;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>活力清新风</h3>
      <p>蓝绿渐变 + 柔和圆角 + 流动元素，传达创新、活力、开放。适合吸引年轻品牌和新兴商业地产。</p>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 32px;">
  <p class="label">你倾向哪种风格？点击选择后告诉我。</p>
</div>
